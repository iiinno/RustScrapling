name: RustScrapling verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-parity:
    name: Python v0.5 API and MCP parity snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout RustScrapling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact upstream Scrapling v0.5 source
        uses: actions/checkout@v4
        with:
          repository: D4Vinci/Scrapling
          ref: 95cf9019ab5a5d6f3e9654b7ef1c6a26e29dc5c0
          path: upstream-scrapling
          persist-credentials: false
      - name: Run dependency-free source inventory regression tests
        run: python3 -m unittest discover -s tests -p test_m0_inventory.py -v
      - name: Ensure pinned upstream inventory is reproducible
        run: python3 oracle/inventory_upstream.py --upstream upstream-scrapling --out docs/compat --check
      - name: Verify Rust API and MCP static audit snapshots
        run: python3 oracle/audit_parity.py --check

  supply-chain:
    name: RustSec advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cargo-audit (locked)
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo.lock against the RustSec database
        run: cargo audit --deny warnings

  linux:
    name: Rust / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm
      - name: Install Rust stable components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: SBOM generation and dependency license audit
        run: python3 scripts/sbom.py --out "$RUNNER_TEMP/SBOM.cdx.json"
      - name: Run workspace unit and integration tests
        run: cargo +stable test --workspace --lib --tests --locked
      - name: Clippy, including binaries and integration tests
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build CLI for real process tests
        run: cargo +stable build -p rustscrapling-cli --locked
      - name: Localhost-only end-to-end smoke test
        run: python3 tests/e2e_local.py target/debug/rustscrapling

  chrome-e2e:
    name: Real Chrome E2E / localhost only
    # Kept separate from the mocked workspace tests (AGENTS.md / Plan 8.4 L4).
    # Uses the runner's preinstalled Chrome; it is not Chrome 155/156 and
    # therefore does not by itself satisfy G-03.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
      RUSTSCRAPLING_CHROME_FOR_TESTING: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Record browser version
        run: /usr/bin/google-chrome --version
      - name: Opt-in real Chrome browser tests (ignored by default)
        run: cargo +stable test -p rustscrapling-browser --tests --locked -- --ignored --test-threads=1
      - name: MCP executor tests against real Chrome
        run: cargo +stable test -p rustscrapling-mcp --tests --locked -- --test-threads=1

  chrome-matrix:
    name: Chrome for Testing 155/156 matrix (installed by rustscrapling install)
    # Plan G-03: same real-browser suites on pinned Chrome for Testing builds,
    # headless and headed (Xvfb), including long-lived session reuse.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm xvfb
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build CLI
        run: cargo +stable build --locked -p rustscrapling-cli
      - name: Allow the Chrome sandbox for binaries outside /opt (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Chrome for Testing 156 (pinned SHA-256) and 155 (explicit SHA-256)
        run: |
          target/debug/rustscrapling install --dir "$RUNNER_TEMP/cft156"
          target/debug/rustscrapling install --dir "$RUNNER_TEMP/cft155" --version 155.0.8059.84 \
            --sha256 cf0f049892dea22e6a6db26d47ed0d7776b7158edcbec4634086633df8bafcbc
      - name: Real-browser suites on 155 and 156
        run: >
          scripts/chrome_e2e_matrix.sh
          "$RUNNER_TEMP/cft155/chrome-155.0.8059.84-linux64/chrome-linux64/chrome"
          "$RUNNER_TEMP/cft156/chrome-156.0.8078.80-linux64/chrome-linux64/chrome"

  release-smoke:
    name: Release binary smoke and checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Build locked release binary
        run: cargo +stable build --release --locked -p rustscrapling-cli
      - name: Smoke test and checksums
        run: scripts/release_smoke.sh target/release/rustscrapling target/release-smoke
      - name: Upload binary, SHA256SUMS and manifest
        uses: actions/upload-artifact@v4
        with:
          name: rustscrapling-linux-x86_64-${{ github.sha }}
          path: |
            target/release-smoke/rustscrapling
            target/release-smoke/SHA256SUMS
            target/release-smoke/manifest.json
          retention-days: 14

name: RustScrapling verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Rust / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm
      - name: Install Rust stable components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run workspace unit and integration tests
        run: cargo +stable test --workspace --lib --tests --locked
      - name: Clippy, including binaries and integration tests
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build CLI for real process tests
        run: cargo +stable build -p rustscrapling-cli --locked
      - name: Localhost-only end-to-end smoke test
        run: python3 tests/e2e_local.py target/debug/rustscrapling

name: RustScrapling verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-parity:
    name: Python v0.5 API and MCP parity snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout RustScrapling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact upstream Scrapling v0.5 source
        uses: actions/checkout@v4
        with:
          repository: D4Vinci/Scrapling
          ref: 95cf9019ab5a5d6f3e9654b7ef1c6a26e29dc5c0
          path: upstream-scrapling
          persist-credentials: false
      - name: Run dependency-free source inventory regression tests
        run: python3 -m unittest discover -s tests -p test_m0_inventory.py -v
      - name: Ensure pinned upstream inventory is reproducible
        run: python3 oracle/inventory_upstream.py --upstream upstream-scrapling --out docs/compat --check
      - name: Verify Rust API and MCP static audit snapshots
        run: python3 oracle/audit_parity.py --check

  linux:
    name: Rust / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm
      - name: Install Rust stable components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run workspace unit and integration tests
        run: cargo +stable test --workspace --lib --tests --locked
      - name: Clippy, including binaries and integration tests
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Build CLI for real process tests
        run: cargo +stable build -p rustscrapling-cli --locked
      - name: Localhost-only end-to-end smoke test
        run: python3 tests/e2e_local.py target/debug/rustscrapling

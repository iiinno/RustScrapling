name: RustScrapling verification
run-name: Verification ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-parity:
    name: Python v0.5 API and MCP parity snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout RustScrapling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact upstream Scrapling v0.5 source
        uses: actions/checkout@v4
        with:
          repository: D4Vinci/Scrapling
          ref: 95cf9019ab5a5d6f3e9654b7ef1c6a26e29dc5c0
          path: upstream-scrapling
          persist-credentials: false
      - name: Run dependency-free source inventory regression tests
        run: python3 -m unittest discover -s tests -p test_m0_inventory.py -v
      - name: Ensure pinned upstream inventory is reproducible
        run: python3 oracle/inventory_upstream.py --upstream upstream-scrapling --out docs/compat --check
      - name: Verify Rust API and MCP static audit snapshots
        run: python3 oracle/audit_parity.py --check

  linux:
    name: Rust / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record hosted runner and source identity
        run: python3 -I -B tests/run_u3_ci.py --prepare --output "${RUNNER_TEMP}/rustscrapling-ci"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev \
            pkg-config libxml2-dev nasm
      - name: Install Rust stable components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Run fmt, workspace tests, strict Clippy, CLI build, U3 and callers
        run: python3 -I -B tests/run_u3_ci.py --output "${RUNNER_TEMP}/rustscrapling-ci"
      - name: Upload command and case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustscrapling-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/rustscrapling-ci/public/ci-receipt.json
            ${{ runner.temp }}/rustscrapling-ci/public/u3-cli.json
            ${{ runner.temp }}/rustscrapling-ci/public/*.log

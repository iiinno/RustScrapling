[package]
name = "rustscrapling-spider"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
rustscrapling-dom = { path = "../rustscrapling-dom" }
rustscrapling-fetch = { path = "../rustscrapling-fetch" }
rustscrapling-http = { path = "../rustscrapling-http" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
regex.workspace = true
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
futures-util = "0.3"
blake3 = "1"
toml = "0.8"
roxmltree = "0.20"
csv = "1.3"

[dev-dependencies]
tempfile = "3"

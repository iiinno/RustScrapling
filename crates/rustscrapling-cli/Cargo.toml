[package]
name = "rustscrapling-cli"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[[bin]]
name = "rustscrapling"
path = "src/main.rs"

[dependencies]
rustscrapling-dom = { path = "../rustscrapling-dom" }
rustscrapling-select = { path = "../rustscrapling-select" }
rustscrapling-adaptive = { path = "../rustscrapling-adaptive" }
rustscrapling-http = { path = "../rustscrapling-http" }
rustscrapling-extract = { path = "../rustscrapling-extract" }
rustscrapling-fetch = { path = "../rustscrapling-fetch" }
rustscrapling-browser = { path = "../rustscrapling-browser" }
rustscrapling-spider = { path = "../rustscrapling-spider" }
rustscrapling-daemon = { path = "../rustscrapling-daemon", features = ["fetch-integration"] }
rustscrapling-mcp = { path = "../rustscrapling-mcp" }
clap.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[package]
name = "rustscrapling-daemon"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
getrandom = "0.3"
rustscrapling-fetch = { path = "../rustscrapling-fetch", optional = true }
rustscrapling-http = { path = "../rustscrapling-http", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
url = { workspace = true }

[features]
default = []
# Enable after Stage3 HTTP lands on the integration branch.
fetch-integration = ["dep:rustscrapling-fetch", "dep:rustscrapling-http"]

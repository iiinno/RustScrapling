[package]
name = "rustscrapling-mcp"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
rustscrapling-http = { path = "../rustscrapling-http" }
rustscrapling-fetch = { path = "../rustscrapling-fetch" }
rustscrapling-browser = { path = "../rustscrapling-browser" }
rustscrapling-extract = { path = "../rustscrapling-extract" }
url.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
regex.workspace = true

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.27"

[package]
name = "rustscrapling-mcp"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

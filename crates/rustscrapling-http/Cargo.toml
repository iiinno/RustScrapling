[package]
name = "rustscrapling-http"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
wreq = { version = "=0.16.3", default-features = false, features = ["tokio-rt", "gzip", "brotli", "zstd", "deflate", "socks", "system-proxy", "stream", "cookies"] }
wreq-util = "=0.2.0"
tokio = { version = "1", features = ["time", "net", "rt", "rt-multi-thread", "macros", "io-util", "sync"] }
serde = { workspace = true }
url = { workspace = true }
futures-util = "0.3"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
quinn = "0.11"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
bytes = "1"
http = "1"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio-rustls = "0.26"
